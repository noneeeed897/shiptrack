<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ShipTrack{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="brand" href="{{ url_for('home') }}">📦 ShipTrack</a>
  <nav>
    <a href="{{ url_for('home') }}">Track order</a>
    {% if is_admin %}<a href="{{ url_for('admin') }}">Dashboard</a><a href="{{ url_for('logout') }}">Log out</a>
    {% else %}<a href="{{ url_for('login') }}">Admin</a>{% endif %}
  </nav>
</div></header>
<main class="wrap">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="alert {{ cat }}">{{ msg }}</div>{% endfor %}
  {% block body %}{% endblock %}
</main>
<footer class="wrap foot">ShipTrack · order tracking &amp; shipment lifecycle</footer>
</body>
</html>
