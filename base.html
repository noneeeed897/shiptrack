<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShipTrack</title>
<style>{% include "style.css" %}</style>
</head><body>
<nav><a class="logo" href="{{ url_for('home') }}">📦 ShipTrack</a>
<div>{% if is_admin %}<a href="{{ url_for('admin') }}">Dashboard</a><a href="{{ url_for('logout') }}">Log out</a>
{% else %}<a href="{{ url_for('login') }}">Admin</a>{% endif %}</div></nav>
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main></body></html>
